            teleprompter: 'Hallo und herzlich willkommen in der Abteilung Elektronik. Mein Name ist Professor Isop und ich unterrichte gemeinsam mit zwei Kollegen den schulautonomen Schwerpunkt Robotik. Elektronik ist heutzutage wichtiger denn je weil alles was an Software irgendwie laufen muss braucht auch entsprechende Hardware. Sprich Elektronik ist eigentlich die Grundlage dafuer um ueberhaupt etwas zu programmieren. Unter anderem natuerlich auch Roboter und KI. Und um euch dazu etwas zu zeigen haben wir fuer euch zwei Roboter vorbereitet. Einmal einen fliegenden Roboter und einmal einen fahrenden Roboter. Beim fliegenden Roboter geht es um den kleinen aber feinen Ryze Tello Quadcopter. Dieser ist klein, leicht, einfach zu fliegen und kostet nur etwa 150eur. Beim fahrenden Roboter geht es um das Elegoo Smart Robot Car 40. Dieser ist ebenfalls sehr guenstig mit Kosten um die 75eur. Mehr technische Details werden euch dann noch die Schueler erklaeren die uns heute lobenswerterweise unterstuezten. Und damit geht es mit dem Tutorial weiter wo ihr schrittweise lernt wie man den Quadcopter programmieren und steuern kann.'
