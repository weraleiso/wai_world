<html>
    <head>
        <title>Open Auditorium</title>

        <meta name="author" content="W. A. Isop"/>

    <body onload="UpdateSlideNumber();UpdateDate()">

        <div class="frame">

            <header id="js_header">BREAK Session</header>

            <nav>
                <button id="btn_slide_number" onClick="GotoSlideNumber()">#</button>
                <button id="btn_previous" onClick="GotoPrevious()">&#8612; Previous</button>
                <button id="btn_next" onClick="GotoNext()">Next &#8614;</button>
                <button id="btn_title" onClick="GotoTitle()"><b>Title</b></button>
                <button id="btn_overview" onClick="GotoOverview()"><b>Overview</b></button>
                <button id="btn_references" onClick="GotoBibliography()"><b>Bibliography</b></button>
                Date:<button id="btn_date" onClick="GotoCalendar()">Current Date</button>
            </nav>

            <main id="js_main">
                <div class="layout_content_title">
                    <img id="img_logo_title" src="images/logo.png" alt="Ah, snap! This image is not available..." height="25%"/>
                    <!--DRAGONFLY DRAGONFLY DRAGONFLY DRAGONFLY DRAGONFLY DRAGONFLY DRAGONFLY DRAGONFLY-->
                    <h1>BREAK Session</h1>
                    <!--The first Octocopter on it's mission to Titan! The first Octocopter on it's mission to Titan! The first Octocopter on it's mission to Titan! The first Octocopter on it's mission...-->
                    <h2>Time to get some more coffee...</h2>
                </div>
            </main>

            <footer>
                <img id="img_logo_footer" src="images/logo.png" alt="Ah, snap! This image is not available..." height="75%"/>
                |Slide:<input type="text" id="txt_filename" size="1"/>| Presented with OA ■ Created 2019, by W. A. Isop
            </footer>
        </div>

        <script src="javascript/script.js"></script>

        <notes hidden="true">
            teleprompter: Add your slide notes here.
            sound: PlenumSettingUpSessionStartup
        </notes>

    </body>

</html>
